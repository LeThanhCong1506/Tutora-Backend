name: CI / CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        type: choice
        options:
          - production
          - staging
        default: 'production'
      ssh_port:
        description: 'Optional SSH port (overrides secret SSH_PORT)'
        required: false
        type: string
      use_sudo:
        description: 'Run docker commands with sudo on remote host'
        required: false
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'

env:
  SSH_USER: ${{ secrets.SERVER_USER }}
  SSH_HOST: ${{ secrets.SERVER_HOST }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Publish artifact (optional)
        if: always()
        run: |
          dotnet publish -c Release -o out || true
        # Don't upload by default; keep artifact locally if you need it.

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: build
    # Only run deploy on main branch pushes or when manually triggered
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'production' }}
    env:
      SSH_USER: ${{ secrets.SERVER_USER }}
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      # SSH_PORT can be set as secret `SSH_PORT` or via workflow_dispatch input `ssh_port`.
      SSH_PORT: ${{ github.event.inputs.ssh_port }}
      USE_SUDO: ${{ github.event.inputs.use_sudo }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          # default port fallback is handled on remote step
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          # set a default port if not provided (will be applied locally for rsync ssh wrapper)
          SSH_PORT=${{ env.SSH_PORT }}
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi

          # Use ssh via port option; the ssh-agent provides the key
          RSYNC_SSH="ssh -p $SSH_PORT -o StrictHostKeyChecking=no"

          rsync -avz --delete -e "$RSYNC_SSH" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='bin/' \
            --exclude='obj/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='*.md' \
            --exclude='appsettings.json' \
            --exclude='appsettings.*.json' \
            ./ ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Remote deploy (docker compose)
        run: |
          SSH_PORT=${{ env.SSH_PORT }}
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi

          # Pass USE_SUDO through environment; default handled on remote host
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no ${{ env.SSH_USER }}@${{ env.SSH_HOST }} bash << 'ENDSSH'
            set -euo pipefail

            # Defaults for remote-side variables
            USE_SUDO=${USE_SUDO:-false}
            DEPLOY_PATH=${DEPLOY_PATH:-.}

            cd "$DEPLOY_PATH"

            echo "📦 Deployment started at $(date)"

            if [ "$USE_SUDO" = "true" ]; then SUDO='sudo'; else SUDO=''; fi

            # Verify docker and docker compose availability
            if ! command -v docker >/dev/null 2>&1; then
              echo "docker not found on remote host" >&2
              exit 1
            fi

            echo "🏗️  Rebuilding app image"
            $SUDO docker compose build --pull app

            echo "🔄 Restarting app container"
            $SUDO docker compose up -d --no-deps app

            echo "⏳ Waiting for app to start"
            sleep 10

            echo "🔍 Container status"
            $SUDO docker compose ps

            echo "📋 Recent logs"
            $SUDO docker compose logs --tail=30 app || true

            echo "✅ Deployment completed at $(date)"
          ENDSSH

      - name: Health check
        run: |
          SSH_PORT=${{ env.SSH_PORT }}
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi

          ssh -p $SSH_PORT -o StrictHostKeyChecking=no ${{ env.SSH_USER }}@${{ env.SSH_HOST }} bash << 'ENDSSH'
            set -e
            cd "${DEPLOY_PATH}"

            RUNNING=$($($SUDO docker compose ps --services --filter "status=running" | wc -l) 2>/dev/null || true)
            TOTAL=$($($SUDO docker compose ps --services | wc -l) 2>/dev/null || true)

            # Fallback simple check if compose commands above fail
            if [ -z "$RUNNING" ]; then
              echo "Could not determine running containers; attempting 'docker ps'"
              RUNNING_COUNT=$(docker ps --filter "name=app" --format '{{.Names}}' | wc -l)
              echo "Running containers matching 'app': $RUNNING_COUNT"
            else
              echo "Running containers: $RUNNING/$TOTAL"
            fi

            if [ -n "$TOTAL" ] && [ "$RUNNING" -eq "$TOTAL" ]; then
              echo "✅ All containers are healthy"
              exit 0
            else
              echo "⚠️ Some containers may be unhealthy"
              exit 1
            fi
          ENDSSH

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date)" >> $GITHUB_STEP_SUMMARY