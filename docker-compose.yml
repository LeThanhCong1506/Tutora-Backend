  app:
    image: ${APP_IMAGE:-hoangnv1005/tutora-k12:latest}
    container_name: tutora-app
    restart: unless-stopped
    ports:
      - "5000:8080"
    # File upload (avatar, tài liệu, ảnh CCCD...) do LocalFileStorageService ghi thẳng ra đĩa.
    # Deploy dùng --force-recreate nên không mount ra host là mất sạch file sau mỗi lần deploy.
    # Mount trùng đường dẫn để LocalStorage__PublicRoot/PrivateRoot trong .env giữ nguyên.
    volumes:
      - /www/tutora-uploads:/www/tutora-uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - tutora-network

  migrate:
    image: ${APP_IMAGE:-hoangnv1005/tutora-k12:latest}
    restart: "no"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    entrypoint: ["dotnet", "MV.PresentationLayer.dll", "--run-managed-migrations"]
    networks:
      - tutora-network

networks:
  tutora-network:
    driver: bridge
