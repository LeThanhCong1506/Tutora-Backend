  app:
    image: hoangnv1005/tutora-k12:latest
    container_name: tutora-app
    restart: unless-stopped
    ports:
      - "5000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - tutora-network

networks:
  tutora-network:
    driver: bridge